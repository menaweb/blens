    texto: "¿Se comprueba que los algoritmos y certificados que usáis siguen siendo los recomendados?"
    por_que: "Es el refuerzo de algoritmos autorizados, obligatorio en Media y Alta. El CCN publica qué algoritmos se consideran válidos y cambian con el tiempo."
