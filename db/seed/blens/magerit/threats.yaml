# Seed BLENS · Catálogo de amenazas (MAGERIT v3, Libro II)
# Modelos: MageritThreat + MageritThreatDefault (CLAUDE.md §7.1)
#
# dims: dimensiones que puede afectar la amenaza (C confidencialidad, I integridad,
#       D disponibilidad, A autenticidad, T trazabilidad).
# default_frequency: veces al año, orientativo. Es un PUNTO DE PARTIDA editable por el cliente;
#       el análisis de riesgos vale por lo que el cliente ajusta, no por el valor por defecto.
# default_degradation: proporción del valor del activo que se pierde si ocurre (0..1), por dimensión.
# aplica_a: tipos de activo donde tiene sentido proponerla (código de asset_types.yaml).
#
# ⚠️ Los valores por defecto son una primera calibración de BLENS, no de MAGERIT:
# la metodología no fija cifras. Revisar con datos reales de incidentes en cuanto haya clientes.

