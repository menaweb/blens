# hay consultores que defienden una curva más plana en los niveles bajos.
#
# ⚠️ Cambiar esta tabla cambia todos los riesgos residuales ya calculados. No se toca sin
# recalcular y sin anotar por qué: un informe firmado tiene que poder explicarse.

