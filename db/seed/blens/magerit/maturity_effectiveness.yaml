# Modelo: MaturityEffectiveness (CLAUDE.md §7.1) · Consumido por engines/risk_engine (§9.2)
#
# Es la bisagra entre el checklist y el análisis de riesgos: la misma madurez que da el
# índice de cumplimiento da la eficacia de la salvaguarda. Una sola fuente de verdad.
