# Seed BLENS · Mapa medida ↔ amenaza (equivalente curado de la biblioteca de PILAR)
# Modelo: MeasureThreatMap (CLAUDE.md §7.1) · Consumido por engines/risk_engine (§9.2)
#
# Para cada amenaza, qué medidas del ENS actúan como salvaguarda:
#   aspect: FREQ   reduce la probabilidad de que ocurra
#           IMPACT reduce el daño si ocurre
#   weight: 0..1   reducción máxima que aporta esa medida con eficacia 1 (madurez L5)
#   dim:           opcional; si se omite, aplica a todas las dimensiones de la amenaza
#
# Fórmula (§9.2): factor = Π (1 − eficacia(madurez) × weight)
# Por eso los pesos NO suman 1: se combinan multiplicativamente (defensa en profundidad).
#
# CALIBRACIÓN (criterio de BLENS, revisable):
#   0.6–0.7  la medida ataca directamente esa amenaza (es su razón de ser)
#   0.4–0.5  contribución fuerte
#   0.2–0.3  contribución de apoyo
#   0.1      contribución marginal, se incluye solo si es defendible ante un auditor
# Regla: ninguna medida sola anula una amenaza. Máximo 0.7.
#
# ⚠️ v0: primera pasada de curación. Pendiente de revisión con un consultor MAGERIT
# y de contraste con la biblioteca de PILAR sobre un caso real.

version: 1
catalog: MAGERIT-v3
depends_on_catalog: ENS-2022-OSCAL

map:

